services:
  - type: web
    name: brain-tumour-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-build.txt && python export_onnx.py && rm -f models/*.pt models/*.pth && pip uninstall -y torch torchvision segmentation-models-pytorch timm efficientnet-pytorch pretrainedmodels onnx
    startCommand: gunicorn --workers 1 --threads 1 --timeout 180 app:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
